<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CERBERUS // COMBAT TACTICAL NETWORK</title>
    <style>
        :root {
            --glow: #00cc33;       
            --glow-dim: #006611;   
            --bg: #000501;         
            --bg-panel: rgba(0, 15, 3, 0.95); 
            --err: #ff0000;        
            --acc: #00ffff;        
        }
        /* Жёстко фиксируем страницу, запрещая её растягивание */
        html, body {
            background-color: var(--bg);
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden; 
        }
        body {
            color: var(--glow);
            font-family: 'Courier New', monospace;
            font-size: 16px;       
            font-weight: 700;      
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }
        body::before, body::after {
            content: " ";
            display: block;
            position: fixed;
            inset: 0;
            background: linear-gradient(rgba(0, 204, 51, 0.02) 50%, rgba(0, 0, 0, 0.5) 50%), linear-gradient(90deg, rgba(0, 204, 51, 0.03), rgba(0, 0, 0, 0), rgba(0, 204, 51, 0.03));
            z-index: 999;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }
        body::after {
            background: linear-gradient(rgba(0, 0, 0, 0) 90%, rgba(0, 204, 51, 0.05) 95%, rgba(0, 0, 0, 0) 100%);
            background-size: 100% 300%;
            animation: scanline 7s linear infinite;
            z-index: 1000;
        }
        @keyframes scanline {
            0% { background-position: 0 -300%; }
            100% { background-position: 0 300%; }
        }
        @keyframes shake {
            0%, 100% { transform: translate(0, 0); }
            20%, 60% { transform: translate(-4px, 1px); }
            40%, 80% { transform: translate(4px, -1px); }
        }
        .shake { animation: shake 0.2s ease-in-out 2; }
        
        /* ОГРАНИЧЕНИЕ: Коробка терминала теперь имеет фиксированную высоту и подстраивается под экран */
        .terminal-box {
            width: 95%;
            max-width: 850px;
            height: 90vh; /* Занимает максимум 90% высоты экрана */
            background: var(--bg-panel);
            border: 2px solid var(--glow-dim); 
            border-radius: 4px;
            padding: 25px;
            box-shadow: 0 0 30px rgba(0, 204, 51, 0.15), inset 0 0 20px rgba(0, 204, 51, 0.1);
            backdrop-filter: blur(12px);
            position: relative;
            box-sizing: border-box;
            display: flex;
            flex-direction: column; /* Элементы выстраиваются строго друг под другом */
            overflow: hidden;
        }
        .header {
            color: var(--glow);
            border-bottom: 2px solid rgba(0, 204, 51, 0.25);
            padding-bottom: 15px;
            margin-bottom: 15px;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 204, 51, 0.6); 
            position: relative;
            flex-shrink: 0; /* Шапка никогда не сожмётся */
        }
        .hub-logo {
            display: block;
            width: 160px;           
            height: 160px;          
            object-fit: cover;      
            border-radius: 50%;     
            margin: 0 auto 10px auto; 
            opacity: 0.98;
            pointer-events: none;
            filter: drop-shadow(0 0 25px var(--glow)); 
        }
        .split-logos-container {
            display: none;
            justify-content: space-around;
            align-items: center;
            width: 100%;
            margin-bottom: 10px;
        }
        .split-logo-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 45%;
        }
        .split-logo-img {
            width: 130px;
            height: 130px;
            object-fit: cover;
            border-radius: 50%;
            pointer-events: none;
        }
        .split-logo-img.cerb { border: 2px solid #00cc33; filter: drop-shadow(0 0 15px #00cc33); }
        .split-logo-img.tfb { border: 2px solid #ff0000; filter: drop-shadow(0 0 15px #ff0000); }
        .split-logo-label {
            font-size: 11px;
            margin-top: 4px;
            font-weight: bold;
            letter-spacing: 2px;
        }
        
        /* ИСПРАВЛЕНО: Окно вывода логов получило собственный независимый скролл-бокс */
        #out {
            flex-grow: 1; /* Забирает всё свободное место в центре рамки */
            overflow-y: auto; /* Включает вертикальную прокрутку внутри коробки */
            padding-right: 10px;
            margin-bottom: 15px;
        }
        /* Кастомный минималистичный зелёный скроллбар, чтобы не ломать атмосферу */
        #out::-webkit-scrollbar { width: 4px; }
        #out::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.3); }
        #out::-webkit-scrollbar-thumb { background: var(--glow-dim); border-radius: 2px; }

        .line {
            line-height: 1.5;
            margin-bottom: 8px;
            word-break: break-all;
            white-space: pre-wrap;
            text-shadow: 0 0 4px rgba(0, 204, 51, 0.2); 
        }
        .input-line {
            display: flex;
            align-items: center;
            margin-top: auto; /* Строка ввода всегда прижата к нижнему краю рамки */
            padding-top: 10px;
            border-top: 1px solid rgba(0, 204, 51, 0.1);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s;
            flex-shrink: 0;
        }
        .input-line.active { opacity: 1; visibility: visible; }
        .prompt {
            margin-right: 12px;
            color: var(--glow);
            font-weight: bold;
            flex-shrink: 0;
            letter-spacing: 1px;
            text-shadow: 0 0 6px var(--glow);
        }
        .input-wrapper {
            position: relative;
            flex-grow: 1;
            display: flex;
            align-items: center;
        }
        input {
            position: absolute;
            inset: 0;
            opacity: 0;
            background: transparent;
            border: none;
            outline: none;
            cursor: text;
            width: 100%;
        }
        .custom-view {
            color: #ffffff;        
            font-family: inherit;
            font-size: inherit;
            font-weight: bold;
            white-space: pre-wrap;
            display: inline-flex;
            align-items: center;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
        }
        .custom-view::after {
            content: '_';
            margin-left: 4px;
            color: var(--glow);     
            animation: blink 0.8s infinite;
            text-shadow: 0 0 10px var(--glow);
        }
        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }
        .error { color: var(--err); font-weight: bold; text-shadow: 0 0 10px rgba(255, 0, 0, 0.6); }
        .success { color: var(--acc); font-weight: bold; text-shadow: 0 0 10px rgba(0, 255, 255, 0.6); }
        .gray { color: rgba(0, 204, 51, 0.45); } 
        .text-cerberus { color: #00cc33; text-shadow: 0 0 5px rgba(0, 204, 51, 0.5); }
        .text-tfb { color: #ff0000; text-shadow: 0 0 5px rgba(255, 0, 0, 0.5); }
    </style>
</head>

<body>
<div class="terminal-box" id="term">
    <div class="header" id="hd">
        <img src="CERBERUS_logo.gif" class="hub-logo" id="single-logo" alt="CERBERUS LOGO">

<script>
const CFG = { 
    REAL_TOKEN: "brent-outbreak-2026", 
    SPD: 15 
};
const DOM = { 
    term: document.getElementById('term'), 
    inp: document.getElementById('inp'), 
    view: document.getElementById('view'), 
    out: document.getElementById('out'), 
    pr: document.getElementById('pr'), 
    blk: document.getElementById('blk'),
    singleLogo: document.getElementById('single-logo'),
    splitLogos: document.getElementById('split-logos'),
    hdTitle: document.getElementById('header-title')
};
let step = 'login', isMask = false, dialogueStage = 0, wordTimer = null;
let strikes = 0; 
const delay = ms => new Promise(r => setTimeout(r, ms));

let audioCtx = null;

function playBeep(f, t, d) {
    try {
        if (!audioCtx) return; 
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = t; 
        osc.frequency.value = f; 
        g.gain.setValueAtTime(0.02, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + d);
        osc.connect(g); 
        g.connect(audioCtx.destination); 
        osc.start(); 
        osc.stop(audioCtx.currentTime + d);
    } catch(e) {}
}

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}

// ИСПРАВЛЕНО: Функция теперь крутит именно внутреннее окошко логов, а не страницу сайта!
function addLine(txt, cls = "") {
    const d = document.createElement('div'); 
    d.className = `line ${cls}`; 
    d.textContent = txt; 
    DOM.out.appendChild(d);
    DOM.out.scrollTop = DOM.out.scrollHeight; // Железный фокус на самую нижнюю строку
    return d;
}

// ИСПРАВЛЕНО: Звук убран из цикла печати на этапе старта, чтобы не вешать скрипт
async function type(txt, cls = "") {
    const d = addLine("", cls);
    for (let i = 0; i < txt.length; i++) {
        d.textContent += txt.charAt(i); 
        playBeep(550, 'sawtooth', 0.02); 
        await delay(CFG.SPD);
    }
}

// ИСПРАВЛЕНО: Убраны все звуковые триггеры при старте, логи побегут 100%
async function runBootLogs() {
    DOM.out.innerHTML = ""; 
    const p = [
        "INITIALIZING ARMORED DEFENSE LINE... ONLINE", 
        "CONNECTING CALIBER TURRET LINKS... CONFIGURED", 
        "ENGAGING SECURE BUNKER PERIMETER... ISOLATED", 
        "SCANNING BERSERK GARISON REGIMENT... DISCIPLINE 100%", 
        "CRITICAL SECURITY PROTOCOL 'T.F.B' ENGAGED."
    ];
    for (let i = 0; i < p.length; i++) {
        await delay(80 + Math.random() * 80); 
        addLine("[CERBERUS-TACTICAL] | " + p[i], 'gray'); 
    }
    await delay(300); 
    await type("SYS: MILITARY GATEWAY DETECTED. BARRICADE KEY REQUIRED.", "gray");
    await type("SYS: LETHAL FORCE IS AUTHORIZED FOR INTRUDERS.", "error"); 
    ask('ENTER ASSIGNMENT PASSKEY:', 'login', false);
}

function ask(p, s, m) { 
    step = s; 
    isMask = m; 
    DOM.pr.textContent = p; 
    DOM.inp.value = DOM.view.textContent = ""; 
    DOM.inp.disabled = false; 
    DOM.blk.classList.add('active'); 
    DOM.inp.focus(); 
}

function err(m) { 
    DOM.term.classList.add('shake'); 
    playBeep(120, 'sawtooth', 0.4); 
    setTimeout(() => DOM.term.classList.remove('shake'), 400); 
    addLine(m, "error"); 
}

async function terminalScramblerDie(m) {
    clearTimeout(wordTimer);
    DOM.blk.classList.remove('active');
    DOM.inp.disabled = true;
    err(m);
    await delay(1000);
    await type("[БОРЗ]: Канал окончательно рухнул под помехами. Сброс терминала.", "error");
    await delay(1500);
    DOM.out.innerHTML = "";
    DOM.singleLogo.style.display = 'block';
    DOM.splitLogos.style.display = 'none';
    
    playBeep(50, 'sawtooth', 2.5);
    DOM.term.style.border = "2px solid #ff0000";
    DOM.term.classList.add('shake');
    
    const errBox = addLine("\n\n\n\n      ███████  ██████  ██████   ██████  ██████  \n      ██       ██   ██ ██   ██ ██    ██ ██   ██ \n      █████    ██████  ██████  ██    ██ ██████  \n      ██       ██   ██ ██   ██ ██    ██ ██   ██ \n      ███████  ██   ██ ██   ██  ██████  ██   ██ \n\n", "error");
    errBox.style.fontSize = "22px"; errBox.style.textAlign = "center";
    await delay(2000);
    location.reload();
}

async function bar() {
    const d = addLine("", 'success');
    for (let p = 0; p <= 100; p += 5) { 
        d.textContent = `LOADING HEAVY ARMORED NETWORKS: [${"█".repeat(p/5)}${".".repeat(20-(p/5))}] ${p}%`; 
        playBeep(250 + p * 2, 'sawtooth', 0.02); 
        await delay(45); 
    }
}

    await type("===================================================", "gray");
    await type("ACCESS GRANTED. CHVK CERBERUS RECON CORE SYSTEM v1.0", "text-cerberus");
    await type("ТАКТИЧЕСКИЙ КОНТРОЛЬ НАД БАЗОЙ В АЛТАЙСКИХ ГОРAX УСТАНОВЛЕН.", "text-cerberus");
    await type("1. МОНИТОРИНГ ТЕПЛОВИЗОРОВ И ПЕРИМЕТРА ЛАБОРАТОРИИ 'ГАЛОГЕН'", "text-cerberus");
    await type("2. СТАТУС ШТУРМОВЫХ ГРУПП И ОГНЕВОЙ ПОДДЕРЖКИ SHF / ATLANTIS", "text-cerberus");
    await type("3. РЕЕСТР ПЕРЕХВАЧЕННЫХ РАЗРАБОТОК И СЕКРЕТНЫХ ТРОФЕЕВ", "text-cerberus");
    await type("4. ОТКЛЮЧИТЬСЯ ОТ ТАКТИЧЕСКОГО ЦЕНТРА", "text-cerberus");
    await type("===================================================", "gray");
    ask('ENTER COMMAND:', 'las_menu', false);
}
DOM.inp.oninput = () => { if(step !== 'game') DOM.view.textContent = isMask ? "*".repeat(DOM.inp.value.length) : DOM.inp.value; };
DOM.inp.onkeydown = async (e) => {
    if (e.key !== 'Enter') return;
    e.preventDefault(); 
    initAudio(); // Активируем аудио-движок при первом же нажатии Enter

    const v = DOM.inp.value, cv = v.trim(); if (!v) return;

    DOM.blk.classList.remove('active'); DOM.inp.disabled = true; 
    addLine(DOM.pr.textContent + " " + (isMask ? "*".repeat(v.length) : cv), 'success'); 
    await delay(300);
    
    if (step === 'login') {
        if (cv === '504') {
            triggerAmbushDialogue(); 
        } else if (cv === CFG.REAL_TOKEN) {
            await bar(); 
            await openSecureLasMenu(); 
        } else {
            err("TACTICAL ENTRY DENIED: INVALID PASSKEY. ACCOUNT SUSPENDED.");
            await delay(1500); ask('ENTER ASSIGNMENT PASSKEY:', 'login', false);
        }
    } 
    else if (step === 'ambush_choice') {
        clearTimeout(wordTimer);
        if (dialogueStage === 0) {
            if (cv === '3') { dialogueStage = 1; nextDialogueStep(); } 
            else { strikes++; if (strikes >= 2) await terminalScramblerDie("🚨 ТРИБУНАЛ ОКОНЧЕН. ВЫ ЛИКВИДИРОВАНЫ."); else { err("❌ ОШИБКА."); await delay(1000); nextDialogueStep(); } }
        } 
        else if (dialogueStage === 1) {
            if (cv === '1') { dialogueStage = 2; nextDialogueStep(); } 
            else { strikes++; if (strikes >= 2) await terminalScramblerDie("🚨 ТРИБУНАЛ ОКОНЧЕН. ВЫ ЛИКВИДИРОВАНЫ."); else { err("❌ ОШИБКА."); await delay(1000); nextDialogueStep(); } }
        }
        else if (dialogueStage === 2) {
            if (cv === '2') { dialogueStage = 3; nextDialogueStep(); } 
            else { strikes++; if (strikes >= 2) await terminalScramblerDie("🚨 ТРИБУНАЛ ОКОНЧЕН. ВЫ ЛИКВИДИРОВАНЫ."); else { err("❌ ОШИБКА."); await delay(1000); nextDialogueStep(); } }
        }
        else if (dialogueStage === 3) {
            if (cv === '2') { dialogueStage = 4; nextDialogueStep(); } 
            else { strikes++; if (strikes >= 2) await terminalScramblerDie("🚨 ТРИБУНАЛ ОКОНЧЕН. ВЫ ЛИКВИДИРОВАНЫ."); else { err("❌ ОШИБКА."); await delay(1000); nextDialogueStep(); } }
        }
        else if (dialogueStage === 4) {
            if (cv === '3') { successAmbushDialogue(); } 
            else { await terminalScramblerDie("🚨 [БОРЗ]: Ложь! Ты не знаешь нашу ключевую роль на объекте! Ликвидация."); }
        }
    }
    else if (step === 'las_menu') {
        if (cv === '4') {
            await type(">>> РАЗРЫВ СВЯЗИ С ТАКТИЧЕСКИМ ЦЕНТРОМ ЧВК CERBERUS...", "gray");
            await delay(1000); DOM.out.innerHTML = ""; step = 'login';
            ask('ENTER ASSIGNMENT PASSKEY:', 'login', false);
        } else if (cv === '1' || cv === '2' || cv === '3') {
            await type(">>> СИСТЕМА: РАЗДЕЛ ЗАБЛОКИРОВАН. ОЖИДАНИЕ ТАКТИЧЕСКИХ ДАННЫХ ОТ ШТУРМОВЫХ ГРУПП...", "error");
            await delay(1500); ask('ENTER COMMAND:', 'las_menu', false);
        } else {
            err("НЕВЕРНАЯ КОМАНДА."); await delay(1000); ask('ENTER COMMAND:', 'las_menu', false);
        }
    }
};

// Активируем аудио-контекст при клике по экрану, чтобы обойти защиту браузера
document.onclick = () => {
    initAudio();
    if (DOM.inp.disabled === false) DOM.inp.focus();
};

// Железный мгновенный запуск логов без аудио-зависимости!
window.onload = () => {
    runBootLogs();
};
